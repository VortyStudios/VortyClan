  - "&f/clan join <clan> &7- join an open clan"
  - "&f/clan leave &7- leave your clan"
  - "&f/clan kick|ban|unban <player> &7- manage members"
  - "&f/clan promote|demote|transfer <player> &7- change ranks"
  - "&f/clan home &7| &f/clan sethome &7- clan home"
  - "&f/clan open|close &7- open/close joining"
  - "&f/clan pvp &7- toggle friendly fire"
  - "&f/clan chat [message] &7- clan chat"
  - "&f/clan rename|tag|desc|color &7- change clan look"
  - "&f/clan disband &7- disband your clan"

