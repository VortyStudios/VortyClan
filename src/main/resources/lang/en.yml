prompt:
  create: "&eType the clan name (and optional tag) in chat. Example: &fDragons DRG"
  invite: "&eType the name of the player you want to invite."
  rename: "&eType the new clan name."
  tag: "&eType the new clan tag."
  desc: "&eType the new clan description (type - to clear)."
  cancel-hint: "&7Type &fcancel &7to abort."
  cancelled: "&7Cancelled."

role:
  member: "&7Member"
  admin: "&eAdmin"
  owner: "&6Owner"
state:
  on: "&aOn"
  off: "&cOff"
status:
  open: "&aOpen"
  closed: "&cClosed"

info:
  - "&8&m          &r {color}&l{clan} &8[{color}{tag}&8] &8&m          "
  - "&7Owner: &f{owner}"
  - "&7Members: &f{members}&7/&f{max} &8(&a{online} online&8)"
  - "&7Score: &e{score} &8(rank #{rank})"
  - "&7Status: {status} &8| &7Friendly fire: {ff}"
  - "&7Created: &f{created}"
  - "&7Description: &f{desc}"

list-header: "&8&m      &r &b&lTop Clans &7(Page {page}/{pages}) &8&m      "
list-entry: "&7#{rank} {color}{clan} &8[{color}{tag}&8] &7- &f{members} members &7- &e{score} score &7- {status}"
list-empty: "&7There are no clans yet."

